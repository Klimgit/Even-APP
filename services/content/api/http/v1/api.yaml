openapi: 3.0.3
info:
  title: even-content
  version: 0.1.0
  description: Teacher course and lesson editor (content service)

paths:
  /api/v1/teacher/block-types:
    get:
      operationId: listBlockTypes
      tags: [Teacher, BlockTypes]
      summary: Catalog of MVP block types for the lesson editor
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockTypeCategory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/teacher/block-types/{blockType}/favorite:
    post:
      operationId: addTeacherBlockTypeFavorite
      tags: [Teacher, BlockTypes]
      summary: Mark block type as favorite for current teacher
      security:
        - bearerAuth: []
      parameters:
        - name: blockType
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: removeTeacherBlockTypeFavorite
      tags: [Teacher, BlockTypes]
      summary: Remove block type from favorites
      security:
        - bearerAuth: []
      parameters:
        - name: blockType
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/teacher/courses:
    get:
      operationId: listTeacherCourses
      tags: [Teacher, Courses]
      summary: List courses owned by the current teacher
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createTeacherCourse
      tags: [Teacher, Courses]
      summary: Create a course
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/teacher/courses/{courseId}:
