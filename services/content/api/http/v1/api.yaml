      summary: Update lesson with optimistic locking (owner)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonId"
        - name: If-Match
          in: header
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchLessonRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteTeacherLesson
      tags: [Teacher, Lessons]
      summary: Delete lesson (owner)
      security:
