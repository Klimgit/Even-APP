components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BlockId:
      name: blockId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    DefaultError:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    BlockConfig:
      type: object
      additionalProperties: true

    BlockTypeInfo:
      type: object
      required: [block_type, title, is_gradable, is_favorite]
      properties:
        block_type:
          type: string
        title:
          type: string
        description:
          type: string
        is_gradable:
          type: boolean
        is_favorite:
          type: boolean

    BlockTypeCategory:
      type: object
      required: [id, title, types]
      properties:
        id:
          type: string
        title:
          type: string
        types:
          type: array
          items:
            $ref: "#/components/schemas/BlockTypeInfo"

    Course:
      type: object
      required: [id, title, target_language_id, ui_language_id, owner_id, is_published]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        target_language_id:
          type: string
          format: uuid
        ui_language_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        is_published:
          type: boolean
        invite_code:
          type: string

    CreateCourseRequest:
      type: object
      required: [title, target_language_id, ui_language_id]
      properties:
        title:
          type: string
        target_language_id:
          type: string
          format: uuid
        ui_language_id:
          type: string
          format: uuid

    PatchCourseRequest:
      type: object
      properties:
        title:
          type: string
        target_language_id:
          type: string
          format: uuid
        ui_language_id:
          type: string
          format: uuid

    LessonSummary:
      type: object
      required: [id, course_id, title, sort_order, version, status]
      properties:
        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        title:
          type: string
        sort_order:
          type: integer
        version:
          type: integer
        status:
          type: string
          enum: [draft, published]

    Lesson:
      allOf:
        - $ref: "#/components/schemas/LessonSummary"
        - type: object
          required: [sections]
          properties:
            sections:
              type: array
              items:
                $ref: "#/components/schemas/LessonSection"

    CreateLessonRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        sort_order:
          type: integer

    PatchLessonRequest:
      type: object
      properties:
        title:
          type: string
        sort_order:
          type: integer

    LessonSection:
      type: object
      required: [id, title, sort_order, section_kind, blocks]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        sort_order:
          type: integer
        section_kind:
          type: string
          enum: [content, homework, results]
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/LessonBlock"

    CreateSectionRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        section_kind:
          type: string
          enum: [content, homework, results]
        sort_order:
          type: integer

    PatchSectionRequest:
      type: object
      properties:
        title:
          type: string
        sort_order:
          type: integer
        section_kind:
          type: string
          enum: [content, homework, results]

    LessonBlock:
      type: object
      required: [id, sort_order, block_type, config, is_homework, is_gradable]
      properties:
        id:
          type: string
          format: uuid
        section_id:
          type: string
          format: uuid
        sort_order:
          type: integer
        display_label:
          type: string
        title:
          type: string
        block_type:
          type: string
        config:
          $ref: "#/components/schemas/BlockConfig"
        is_homework:
          type: boolean
        is_gradable:
          type: boolean

    CreateLessonBlockRequest:
      type: object
      required: [sort_order, block_type, config]
      properties:
        section_id:
          type: string
          format: uuid
        sort_order:
          type: integer
        display_label:
          type: string
        title:
          type: string
        block_type:
          type: string
        config:
          $ref: "#/components/schemas/BlockConfig"
        is_homework:
          type: boolean

    PatchLessonBlockRequest:
      type: object
      properties:
        section_id:
          type: string
          format: uuid
        sort_order:
          type: integer
        display_label:
          type: string
        title:
          type: string
        block_type:
          type: string
        config:
          $ref: "#/components/schemas/BlockConfig"
        is_homework:
          type: boolean

    ReorderIdsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid

    CourseLexiconCoverage:
      type: object
      required: [introduced_count, exercised_count, lexeme_count]
      properties:
        introduced_count:
          type: integer
        exercised_count:
          type: integer
        lexeme_count:
          type: integer

    CourseLexiconByLessonItem:
      type: object
      required: [lexeme_id, lemma, usage_kind]
      properties:
        lexeme_id:
          type: string
          format: uuid
        lemma:
          type: string
        form:
          type: string
        usage_kind:
          type: string
          enum: [introduced, exercised, referenced]
        block_display_label:
          type: string

    CourseLexiconByLesson:
      type: object
      required: [lesson_id, lesson_title, items]
      properties:
        lesson_id:
          type: string
          format: uuid
        lesson_title:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CourseLexiconByLessonItem"

    FormCoverageEntry:
      type: object
      required: [form_id, form, introduced, exercised]
      properties:
        form_id:
          type: string
          format: uuid
        form:
          type: string
        introduced:
          type: boolean
        exercised:
          type: boolean

    FormsCoverage:
      type: object
      required: [lexeme_id, lemma, forms]
      properties:
        lexeme_id:
          type: string
          format: uuid
        lemma:
          type: string
        forms:
          type: array
          items:
            $ref: "#/components/schemas/FormCoverageEntry"

    InviteCodeResponse:
      type: object
      required: [invite_code]
      properties:
        invite_code:
          type: string

    EnrollStudentRequest:
      type: object
      required: [email, course_id]
      properties:
        email:
          type: string
        course_id:
          type: string
          format: uuid

    StudentEnrolledCourse:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string

    Student:
      type: object
      required: [id, email, enrolled_courses]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        enrolled_courses:
          type: array
          items:
            $ref: "#/components/schemas/StudentEnrolledCourse"

    StudentProgressLesson:
      type: object
      required: [lesson_id, title, completed_blocks, total_blocks, score_avg]
      properties:
        lesson_id:
          type: string
          format: uuid
        title:
          type: string
        completed_blocks:
          type: integer
        total_blocks:
          type: integer
        score_avg:
          type: number
          format: float

    StudentProgress:
      type: object
      required: [user_id, course_id, lessons]
      properties:
        user_id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/StudentProgressLesson"
