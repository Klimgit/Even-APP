openapi: 3.0.3
info:
  title: even-learning
  version: 0.2.0
  description: Student learning — courses, lessons, progress, review, dictionary

paths:
  /api/v1/courses/join:
    post:
      operationId: joinCourse
      tags: [Student, Courses]
      summary: Join a course by invite code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinCourseRequest"
      responses:
        "201":
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinCourseResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invite code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/courses:
    get:
      operationId: listCourses
      tags: [Student, Courses]
      summary: List enrolled courses for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseListItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/courses/public:
    get:
      operationId: listPublicCourses
      tags: [Student, Courses, Public]
      summary: List published public courses open for self-enrollment
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicCourseListItem"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/courses/{courseId}/enroll:
    post:
      operationId: enrollCourse
      tags: [Student, Courses]
      summary: Self-enroll in a published public course
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinCourseResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Course not found or not public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/courses/{courseId}:
    get:
      operationId: getCourse
      tags: [Student, Courses]
      summary: Get course details (requires enrollment)
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/courses/{courseId}/lessons:
    get:
      operationId: listCourseLessons
      tags: [Student, Courses]
      summary: List published lessons with progress
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseLessonListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/courses/{courseId}/outline:
    get:
      operationId: getCourseOutline
      tags: [Student, Courses]
      summary: Course tree with per-block progress for sidebar navigation
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseOutlineResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/lessons/{lessonId}:
    get:
      operationId: getLesson
      tags: [Student, Lessons]
      summary: Get published lesson with sections and blocks
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/lessons/{lessonId}/flow:
    get:
      operationId: getLessonFlow
      tags: [Student, Lessons]
      summary: Lesson playbook with review injections
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonFlow"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/progress/blocks/{blockId}/attempt:
    post:
      operationId: submitBlockAttempt
      tags: [Student, Progress]
      summary: Submit answer for a gradable block
      security:
        - bearerAuth: []
      parameters:
        - name: blockId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockAttemptRequest"
      responses:
        "200":
          description: Graded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockAttemptResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Block not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/progress/lessons/{lessonId}:
    get:
      operationId: getLessonProgress
      tags: [Student, Progress]
      summary: Block progress for a lesson
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonProgressResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/progress/summary:
    get:
      operationId: getProgressSummary
      tags: [Student, Progress]
      summary: Aggregated learning statistics for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/review:
    get:
      operationId: listReview
      tags: [Student, Review]
      summary: Review queue
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, mastered]
        - name: due_only
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/review/session:
    post:
      operationId: startReviewSession
      tags: [Student, Review]
      summary: Start a review session and return the next due item
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSessionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "204":
          description: No items due for review
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/dictionary:
    get:
      operationId: listDictionary
      tags: [Student, Dictionary]
      summary: User vocabulary
      security:
        - bearerAuth: []
      parameters:
        - name: course_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
            description: Filter by lemma (case-insensitive substring)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VocabularyEntry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/DefaultError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    DefaultError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        error:
          type: string

    JoinCourseRequest:
      type: object
      required: [invite_code]
      properties:
        invite_code:
          type: string
          minLength: 1

    JoinCourseResponse:
      type: object
      required: [course_id, enrollment_id]
      properties:
        course_id:
          type: string
          format: uuid
        enrollment_id:
          type: string
          format: uuid

    Language:
      type: object
      required: [id, code, name, native_name, direction, is_active]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        native_name:
          type: string
        direction:
          type: string
          enum: [ltr, rtl]
        is_active:
          type: boolean

    Course:
      type: object
      required: [id, title, target_language_id, ui_language_id, owner_id, is_published]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        target_language_id:
          type: string
          format: uuid
        ui_language_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        is_published:
          type: boolean

    CourseListItem:
      type: object
      required: [id, title, target_language]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        target_language:
          $ref: "#/components/schemas/Language"
        progress_percent:
          type: number
          format: double

    PublicCourseListItem:
      type: object
      required: [id, title, target_language, is_published]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        target_language:
          $ref: "#/components/schemas/Language"
        is_published:
          type: boolean

    ProgressSummary:
      type: object
      required: [enrolled_courses, dictionary_words, review_due, completed_blocks, completed_lessons, in_progress_lessons, average_score, time_spent_seconds]
      properties:
        enrolled_courses:
          type: integer
        dictionary_words:
          type: integer
        review_due:
          type: integer
        completed_blocks:
          type: integer
        completed_lessons:
          type: integer
        in_progress_lessons:
          type: integer
        average_score:
          type: number
          format: double
        time_spent_seconds:
          type: integer

    ResolvedMedia:
      type: object
      required: [id, url, display_name, mime_type, media_kind, scope]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        display_name:
          type: string
        mime_type:
          type: string
        media_kind:
          type: string
          enum: [image, audio, video]
        scope:
          type: string
          enum: [platform, teacher]

    ReviewSessionResponse:
      type: object
      required: [item, pending_count, due_count]
      properties:
        item:
          $ref: "#/components/schemas/ReviewItem"
        pending_count:
          type: integer
        due_count:
          type: integer

    CourseLessonSummary:
      type: object
      required: [id, title, sort_order, completed_percent]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        sort_order:
          type: integer
        completed_percent:
          type: number
          format: double

    CourseLessonListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CourseLessonSummary"

    CourseOutlineResponse:
      type: object
      required: [course_id, title, progress_percent, modules]
      properties:
        course_id:
          type: string
          format: uuid
        title:
          type: string
        progress_percent:
          type: number
          format: double
        current_lesson_id:
          type: string
          format: uuid
        current_block_id:
          type: string
          format: uuid
        modules:
          type: array
          items:
            $ref: "#/components/schemas/CourseOutlineModule"

    CourseOutlineModule:
      type: object
      required: [id, title, sort_order, progress_percent, lessons]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        sort_order:
          type: integer
        progress_percent:
          type: number
          format: double
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/CourseOutlineLesson"

    CourseOutlineLesson:
      type: object
      required: [id, title, sort_order, progress_percent, sections]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        sort_order:
          type: integer
        progress_percent:
          type: number
          format: double
        sections:
          type: array
          items:
            $ref: "#/components/schemas/CourseOutlineSection"

    CourseOutlineSection:
      type: object
      required: [id, title, sort_order, progress_percent, blocks]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        sort_order:
          type: integer
        progress_percent:
          type: number
          format: double
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/CourseOutlineBlock"

    CourseOutlineBlock:
      type: object
      required:
        - id
        - lesson_id
        - title
        - sort_order
        - block_type
        - is_gradable
        - status
        - progress_percent
        - is_current
      properties:
        id:
          type: string
          format: uuid
        lesson_id:
          type: string
          format: uuid
        display_label:
          type: string
        title:
          type: string
        sort_order:
          type: integer
        block_type:
          type: string
        is_gradable:
          type: boolean
        status:
          type: string
          enum: [not_started, in_progress, completed]
        progress_percent:
          type: number
          format: double
        is_current:
          type: boolean

    ResolvedLexeme:
      type: object
      required: [id, lemma]
      properties:
        id:
          type: string
          format: uuid
        lemma:
          type: string
        part_of_speech:
          type: string

    Lesson:
      type: object
      required: [id, course_id, title, sort_order, version, status, sections]
      properties:
        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        title:
          type: string
        sort_order:
          type: integer
        version:
          type: integer
        status:
          type: string
          enum: [draft, published]
        resolved_lexemes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ResolvedLexeme"
        resolved_media:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ResolvedMedia"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/LessonSection"

    LessonSection:
      type: object
      required: [id, title, sort_order, section_kind, blocks]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        sort_order:
          type: integer
        section_kind:
          type: string
          enum: [content, homework, results]
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/LessonBlock"

    LessonBlock:
      type: object
      required: [id, sort_order, block_type, config, is_homework, is_gradable]
      properties:
        id:
          type: string
          format: uuid
        section_id:
          type: string
          format: uuid
        sort_order:
          type: integer
        display_label:
          type: string
        title:
          type: string
        block_type:
          type: string
        config:
          type: object
          additionalProperties: true
        is_homework:
          type: boolean
        is_gradable:
          type: boolean

    LessonFlow:
      type: object
      required: [lesson_id, version, items]
      properties:
        lesson_id:
          type: string
          format: uuid
        version:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LessonFlowItem"

    LessonFlowItem:
      oneOf:
        - $ref: "#/components/schemas/LessonFlowBlockItem"
        - $ref: "#/components/schemas/LessonFlowReviewItem"
      discriminator:
        propertyName: kind
        mapping:
          lesson_block: "#/components/schemas/LessonFlowBlockItem"
          review_injection: "#/components/schemas/LessonFlowReviewItem"

    LessonFlowBlockItem:
      type: object
      required: [kind, block]
      properties:
        kind:
          type: string
          enum: [lesson_block]
        block:
          $ref: "#/components/schemas/LessonBlock"

    LessonFlowReviewItem:
      type: object
      required: [kind, review]
      properties:
        kind:
          type: string
          enum: [review_injection]
        review:
          $ref: "#/components/schemas/ReviewItem"

    BlockAttemptRequest:
      type: object
      required: [response]
      properties:
        sub_item_index:
          type: integer
          default: 0
        response:
          type: object
          additionalProperties: true
        context:
          type: string
          enum: [lesson, review_tab, injected]
          default: lesson
        time_spent_seconds:
          type: integer
          minimum: 0
          description: Seconds spent on this attempt (accumulated into block progress)

    UserBlockProgress:
      type: object
      required: [lesson_block_id, status, score, attempts]
      properties:
        lesson_block_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [not_started, in_progress, completed]
        score:
          type: number
          format: double
        attempts:
          type: integer

    BlockAttemptResponse:
      type: object
      required: [is_correct, score, block_progress]
      properties:
        is_correct:
          type: boolean
        score:
          type: number
          format: double
        correct_answer:
          type: object
          additionalProperties: true
        block_progress:
          $ref: "#/components/schemas/UserBlockProgress"

    LessonProgressResponse:
      type: object
      required: [lesson_id, blocks]
      properties:
        lesson_id:
          type: string
          format: uuid
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/UserBlockProgress"

    ReviewItem:
      type: object
      required:
        - lesson_block_id
        - sub_item_index
        - block_type
        - source_lesson_id
        - source_lesson_title
        - failure_count
        - due_at
        - status
        - block
      properties:
        lesson_block_id:
          type: string
          format: uuid
        sub_item_index:
          type: integer
        block_type:
          type: string
        title:
          type: string
        source_lesson_id:
          type: string
          format: uuid
        source_lesson_title:
          type: string
        failure_count:
          type: integer
        due_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, mastered]
        block:
          $ref: "#/components/schemas/LessonBlock"

    ReviewListResponse:
      type: object
      required: [pending_count, due_count, items]
      properties:
        pending_count:
          type: integer
        due_count:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewItem"

    Lexeme:
      type: object
      required: [id, language_id, lemma]
      properties:
        id:
          type: string
          format: uuid
        language_id:
          type: string
          format: uuid
        lemma:
          type: string
        part_of_speech:
          type: string
        notes:
          type: string
        primary_image_url:
          type: string
        primary_audio_url:
          type: string

    VocabularyEntry:
      type: object
      required: [lexeme, first_seen_at, mastery]
      properties:
        lexeme:
